# EdgeOne Pages 构建配置
# 文档：https://console.cloud.tencent.com/edgeone

[build]
  # 构建命令
  build_command = "npm run build"
  
  # 输出目录
  publish = "dist"
  
  # Node.js 版本
  node_version = "20"

# 环境变量配置（敏感信息请在 EdgeOne 控制台设置）
[build.environment]
  NODE_ENV = "production"

# 重定向规则（可选）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
